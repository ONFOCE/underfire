<script>
// ============ 程序化音频引擎 (Web Audio API) ============
const Audio = (function(){
  let ctx=null, master=null, buses={}, muted=false;
  let ambient=null, tension=0.0, heartTimer=null, heartOn=false;
  let noiseBuf=null;

  function ensure(){
    if(ctx) return true;
    try{ ctx = new (window.AudioContext||window.webkitAudioContext)(); }
    catch(e){ return false; }
    master = ctx.createGain(); master.gain.value = muted ? 0 : 1; master.connect(ctx.destination);
    buses = { ambient: bus(0.85), sfx: bus(1.0), ui: bus(0.5) };
    noiseBuf = makeNoise(2);
    return true;
  }
  function bus(g){ const n=ctx.createGain(); n.gain.value=g; n.connect(master); return n; }
  function makeNoise(sec){
    const b=ctx.createBuffer(1, Math.floor(ctx.sampleRate*sec), ctx.sampleRate);
    const d=b.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    return b;
  }
  function osc(type, freq, dest, t0, dur, peak, freqEnd){
    if(!ctx) return;
    const o=ctx.createOscillator(); o.type=type; o.frequency.setValueAtTime(freq,t0);
    if(freqEnd) o.frequency.exponentialRampToValueAtTime(freqEnd, t0+dur);
    const g=ctx.createGain(); g.gain.setValueAtTime(0.0001,t0);
    g.gain.linearRampToValueAtTime(peak,t0+0.005);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g); g.connect(dest); o.start(t0); o.stop(t0+dur+0.02);
  }
  function noiseHit(dest, t0, dur, peak, filterType, f0, f1, q){
    if(!ctx) return;
    const src=ctx.createBufferSource(); src.buffer=noiseBuf; src.loop=true;
    const f=ctx.createBiquadFilter(); f.type=filterType||'lowpass'; f.frequency.setValueAtTime(f0||400,t0);
    if(f1) f.frequency.exponentialRampToValueAtTime(f1, t0+dur);
    f.Q.value=q||0.8;
    const g=ctx.createGain(); g.gain.setValueAtTime(0.0001,t0);
    g.gain.linearRampToValueAtTime(peak,t0+0.004);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    src.connect(f); f.connect(g); g.connect(dest); src.start(t0); src.stop(t0+dur+0.02);
  }

  // ---- 一次性音效（均以 !ctx 兜底，未解锁前静默）----
  function tick(){ if(!ctx) return; const t=ctx.currentTime; noiseHit(buses.ui,t,0.03,0.05,'bandpass',2000,1400,3); osc('square',1600,buses.ui,t,0.018,0.02); }
  function click(){ if(!ctx) return; const t=ctx.currentTime; osc('sine',900,buses.ui,t,0.04,0.14); osc('sine',1800,buses.ui,t,0.03,0.05); }
  function hover(){ if(!ctx) return; const t=ctx.currentTime; osc('sine',480,buses.ui,t,0.04,0.06); }
  function confirm(){ if(!ctx) return; const t=ctx.currentTime; osc('sine',523,buses.ui,t,0.12,0.10); osc('sine',784,buses.ui,t+0.06,0.14,0.10); }
  function success(){ if(!ctx) return; const t=ctx.currentTime; osc('sine',392,buses.sfx,t,0.25,0.10); osc('sine',523,buses.sfx,t+0.08,0.30,0.09); osc('sine',659,buses.sfx,t+0.16,0.40,0.07); }
  function fail(){ if(!ctx) return; const t=ctx.currentTime; osc('sine',150,buses.sfx,t,0.30,0.14,70); noiseHit(buses.sfx,t,0.20,0.10,'lowpass',400,120,0.8); }
  function hurt(){ if(!ctx) return; const t=ctx.currentTime; osc('sine',110,buses.sfx,t,0.35,0.16,55); noiseHit(buses.sfx,t,0.18,0.08,'lowpass',300,90,1); }
  function risk(){ if(!ctx) return; const t=ctx.currentTime; osc('sine',90,buses.sfx,t,0.30,0.12,60); }
  function heartbeat(){ if(!ctx) return; const t=ctx.currentTime; osc('sine',55,buses.sfx,t,0.16,0.18,40); osc('sine',50,buses.sfx,t+0.2,0.20,0.14,38); }
  function gunshot(){ if(!ctx) return; const t=ctx.currentTime; noiseHit(buses.sfx,t,0.25,0.5,'lowpass',6000,500,0.5); osc('sine',120,buses.sfx,t,0.20,0.30,40); }
  function explosion(){ if(!ctx) return; const t=ctx.currentTime; noiseHit(buses.sfx,t,0.90,0.5,'lowpass',4000,60,0.4); osc('sine',70,buses.sfx,t,1.0,0.40,30); }
  function dayKnell(){ if(!ctx) return; const t=ctx.currentTime; osc('sine',196,buses.sfx,t,1.6,0.08); osc('sine',98,buses.sfx,t,1.8,0.10); }
  function title(){ if(!ctx) return; const t=ctx.currentTime; osc('sine',55,buses.ambient,t,3.0,0.25); osc('sine',82.5,buses.ambient,t,3.0,0.12); }
  function endingSad(){ if(!ctx) return; const t=ctx.currentTime; [196,147,98].forEach((f,i)=>osc('sine',f,buses.sfx,t+i*0.4,2.5,0.06)); }
  function endingHope(){ if(!ctx) return; const t=ctx.currentTime; [262,330,392].forEach((f,i)=>osc('sine',f,buses.sfx,t+i*0.35,2.2,0.06)); }

  // ---- 环境底噪（循环，紧张度驱动）----
  function startAmbient(){
    if(!ensure()||ambient) return;
    const t=ctx.currentTime;
    const out=ctx.createGain(); out.gain.value=0.0; out.connect(buses.ambient);
    const d1=ctx.createOscillator(); d1.type='sine'; d1.frequency.value=55;
    const d2=ctx.createOscillator(); d2.type='sine'; d2.frequency.value=55.7;
    const dflt=ctx.createBiquadFilter(); dflt.type='lowpass'; dflt.frequency.value=220;
    const dg=ctx.createGain(); dg.gain.value=0.35;
    d1.connect(dflt); d2.connect(dflt); dflt.connect(dg); dg.connect(out);
    const m=ctx.createOscillator(); m.type='triangle'; m.frequency.value=110;
    const mg=ctx.createGain(); mg.gain.value=0.05; m.connect(mg); mg.connect(out);
    const wind=ctx.createBufferSource(); wind.buffer=noiseBuf; wind.loop=true;
    const wf=ctx.createBiquadFilter(); wf.type='bandpass'; wf.frequency.value=500; wf.Q.value=1.2;
    const wg=ctx.createGain(); wg.gain.value=0.06;
    const lfo=ctx.createOscillator(); lfo.type='sine'; lfo.frequency.value=0.08;
    const lfoG=ctx.createGain(); lfoG.gain.value=220;
    lfo.connect(lfoG); lfoG.connect(wf.frequency);
    wind.connect(wf); wf.connect(wg); wg.connect(out);
    const rum=ctx.createBufferSource(); rum.buffer=noiseBuf; rum.loop=true;
    const rf=ctx.createBiquadFilter(); rf.type='lowpass'; rf.frequency.value=90;
    const rg=ctx.createGain(); rg.gain.value=0.05;
    rum.connect(rf); rf.connect(rg); rg.connect(out);
    [d1,d2,m,wind,rum,lfo].forEach(n=>n.start());
    out.gain.linearRampToValueAtTime(1.0, t+4.0);
    ambient={out,dflt,dg,wf,wg,rg,mg};
    applyTension();
  }
  function applyTension(){
    if(!ambient) return;
    const T=tension;
    ambient.dg.gain.value = 0.30 + T*0.25;
    ambient.wg.gain.value = 0.05 + T*0.08;
    ambient.rg.gain.value = 0.04 + T*0.12;
    ambient.dflt.frequency.value = 180 + T*320;
    ambient.wf.frequency.value = 420 + T*500;
  }
  function setTension(v){ tension=Math.max(0,Math.min(1,v)); applyTension(); }

  function setHeartbeat(on){
    if(!ctx) return;
    if(on && !heartOn){ heartOn=true; heartTimer=setInterval(()=>{ if(heartOn) heartbeat(); }, 640); }
    if(!on && heartOn){ heartOn=false; clearInterval(heartTimer); }
  }

  function setMuted(m){ muted=m; if(master && ctx) master.gain.setTargetAtTime(m?0:1, ctx.currentTime, 0.05); }
  function toggleMuted(){ setMuted(!muted); return muted; }
  function isMuted(){ return muted; }
  function unlock(){ if(!ensure()) return; if(ctx.state==='suspended') ctx.resume(); }

  return {
    unlock, ensure, startAmbient, setTension, setHeartbeat,
    tick, click, hover, confirm, success, fail, hurt, risk,
    heartbeat, gunshot, explosion, dayKnell, title, endingSad, endingHope,
    setMuted, toggleMuted, isMuted
  };
})();
</script>

const state = { hp:100, food:3, materials:1, day:1, helped:0, hardened:0, intel:false, faction:null, ending:null, stats:{}, items:[] };
let current=null, typeTimer=null, typing=false, nightNote='';

const stageEl=document.getElementById('stage'), choicesEl=document.getElementById('choices'), hudEl=document.getElementById('hud');

function $(id){ return document.getElementById(id); }

// —— 关键物品系统 ——
function hasItem(id){ return state.items.includes(id); }
function addItem(id){
  if(!id || state.items.includes(id)) return false;
  if(state.items.length >= ITEM_CAP) return false;
  state.items.push(id); return true;
}
function useItem(id){ const i=state.items.indexOf(id); if(i<0) return false; state.items.splice(i,1); return true; }
function itemBonus(stat){
  let b=0;
  if(hasItem('crowbar') && stat==='search') b+=2;
  if(hasItem('gun') && stat==='accuracy') b+=2;
  return b;
}

// —— 音频引擎初始化 & 静音切换 ——
(function(){
  const b=$('sndBtn');
  function sync(){ if(b) b.textContent = Audio.isMuted() ? '声音' : '静音'; }
  if(b) b.onclick = ()=>{ Audio.unlock(); Audio.toggleMuted(); sync(); };
  window.addEventListener('keydown', e=>{ if(e.key==='m'||e.key==='M'){ Audio.unlock(); Audio.toggleMuted(); sync(); } });
  // 全局按键音：任何可用按钮被点击时播放"咔哒"声
  document.addEventListener('click', e=>{
    const btn = e.target.closest('button');
    if(btn && !btn.disabled) Audio.click();
  });
})();

function updateAudio(){
  const dayT = Math.min(1, (state.day||1)/15);
  const lowHp = state.hp<=30 ? 1 : (state.hp<=50 ? 0.5 : 0);
  const T = Math.min(1, dayT*0.55 + lowHp*0.45 + (state.faction==='army'?0.15:0));
  Audio.setTension(T);
  Audio.setHeartbeat(state.hp>0 && state.hp<=30);
}

function renderHud(){
  $('day').textContent=state.day;
  $('hp').textContent=state.hp;
  $('food').textContent=state.food;
  $('mat').textContent=state.materials;
  const fac=state.faction, fw=$('facWrap');
  if(fac){ fw.style.display=''; $('fac').textContent=FACTION_LABEL[fac]; } else { fw.style.display='none'; }
  const s=$('stats'); s.innerHTML='';
  STATS.forEach(st=>{ const el=document.createElement('span'); el.innerHTML=st.label+' <b>'+state.stats[st.key]+'</b>'; s.appendChild(el); });
  const it=$('items');
  it.textContent = '背包：' + (state.items.length ? state.items.map(i=>ITEM[i]).join(' · ') : '空');
  updateAudio();
}

function chanceOf(stat,diff){ const v=state.stats[stat]+itemBonus(stat); return Math.max(5, Math.min(95, 50+(v-diff)*15)); }
function chanceClass(p){ return p>=70?'good':(p>=40?'warn':'bad'); }
function meets(req){ if(!req) return true; return Object.entries(req).every(([k,v])=>(state[k]||0)>=v); }

function clearChoices(){ choicesEl.innerHTML=''; }

function buildChoices(node, id){
  clearChoices();
  node.choices.forEach(c=>{
    const btn=document.createElement('button');
    btn.addEventListener('mouseenter', ()=>Audio.hover());
    const okToUse = meets(c.requires);
    const meta = c.check
      ? (function(){ const p=chanceOf(c.check.stat, c.check.diff); const st=STATS.find(s=>s.key===c.check.stat); return '<span class="meta '+chanceClass(p)+'">'+st.label+' '+(state.stats[c.check.stat]+itemBonus(c.check.stat))+' · 成功率 '+p+'%</span>'; })()
      : (c.risk!==undefined ? '<span class="meta '+chanceClass(c.risk)+'">成功率 '+c.risk+'%</span>' : '');
    let needTxt = '';
    if(c.requires){ const k=Object.keys(c.requires)[0]; const nm={food:'食物',materials:'物资'}[k]||k; needTxt='<span class="meta muted">（需要 '+nm+' ≥ '+c.requires[k]+'）</span>'; }
    btn.innerHTML = c.label + (okToUse ? meta : needTxt);
    btn.disabled = !okToUse;
    if(id==='d15') btn.onclick = resolveEnding;
    else if(okToUse) btn.onclick = ()=>resolveChoice(c);
    choicesEl.appendChild(btn);
  });
}

function renderScene(id){
  if(id==='d14') id = 'd14_' + (state.faction||'alone');
  current=id; const node=scenes[id];
  if(node.day) state.day=node.day;
  renderHud(); clearChoices();
  const warSting={d1:'gunshot',d3:'gunshot',d6:'explosion',d11:'explosion'};
  if(warSting[id]) setTimeout(()=>Audio[warSting[id]](), 500);

  if(node.ending){ renderEnding(node); return; }

  let text = (id==='d1' ? '' : nightNote) + node.text;
  nightNote='';

  stageEl.classList.remove('done');
  typeText(text, ()=> buildChoices(node, id));
}

function resolveChoice(c){
  let res, text, roll=null;
  const hpBefore=state.hp;
  if(c.check){
    const p=chanceOf(c.check.stat, c.check.diff);
    roll=Math.random()*100 < p;
    res = roll ? c.ok : c.no;
    text = (roll?'「成功」 ':'「失败」 ') + res.text;
  } else if(c.risk!==undefined){
    roll=Math.random()*100 < c.risk;
    res = roll ? c.ok : c.no;
    text = (roll?'「顺利」 ':'「不测」 ') + res.text;
  } else {
    res = c.ok; text = res.text;
  }
  if(roll===null){ Audio.confirm(); } else if(roll){ Audio.success(); } else { Audio.fail(); }
  if(res.effect){
    const cold = res.effect.cold && hasItem('coat');
    for(const [k,v] of Object.entries(res.effect)){
      if(k==='item'){ if(addItem(v)) text += '\n\n（获得物品：'+ITEM[v]+'）'; else text += '\n\n（背包已满，你没能带走'+ITEM[v]+'。）'; continue; }
      if(k==='cold'){ continue; }
      if(k==='hp' && v<0 && cold){ continue; }
      state[k]+=v;
    }
  }
  if(res.faction){ state.faction=res.faction; const fb=FACTION_BONUS[res.faction]; if(fb) for(const [k,v] of Object.entries(fb)) state.stats[k]=(state.stats[k]||0)+v; }
  // 防弹衣：本次受伤减半（一次性，先于钳制处理以正确减伤）
  if(state.hp < hpBefore && useItem('vest')) state.hp = hpBefore - Math.round((hpBefore - state.hp)/2);
  if(state.hp<0) state.hp=0;
  if(state.hp>100) state.hp=100;
  if(state.materials<0) state.materials=0;
  if(state.food<0) state.food=0;
  if(state.hp < hpBefore){ Audio.hurt(); }
  renderHud();

  // 死亡判定（医疗包可救回一次）
  if(state.hp<=0){
    if(useItem('medkit')){ state.hp=30; text += '\n\n（医疗包救了你一命，生命恢复至 30。）'; renderHud(); }
    else { state.ending='e_death'; showResult(text, ()=>{ renderEnding(scenes.e_death); }); return; }
  }

  const next = res.next || 'd15';
  showResult(text, ()=>advance(next));
}

function advance(next){
  if(next==='d14') next='d14_'+(state.faction||'alone');
  const node=scenes[next];
  // 夜晚消耗（跨天时；军队管吃管住，不消耗口粮）
  if(node.day && node.day>1){
    Audio.dayKnell();
    if(state.faction!=='army'){
      if(state.food>0){ state.food--; nightNote='（这一夜，你吃掉了一份口粮。）\n\n'; }
      else { state.hp-=20; if(state.hp<0)state.hp=0; Audio.hurt(); nightNote='（这一夜，你饿着肚子。胃里像有火在烧，生命 -20。）\n\n'; if(state.hp<=0){ if(useItem('medkit')){ state.hp=30; nightNote+='（医疗包救了你一命，生命恢复至 30。）\n\n'; } else { state.ending='e_death'; renderEnding(scenes.e_death); return; } } }
    }
  }
  // 随机事件
  if(node.day && node.day>=2 && node.day<=14 && Math.random()<0.35){
    const ev=pickEvent();
    if(ev) return renderEvent(ev, next);
  }
  renderScene(next);
}

function showResult(text, onContinue){
  clearChoices();
  stageEl.classList.remove('done');
  typeText(text, ()=>{
    const btn=document.createElement('button'); btn.className='primary'; btn.textContent='继续';
    btn.onclick=onContinue; choicesEl.appendChild(btn);
  });
}

function resolveEnding(){
  let id;
  if(state.hp<=0) id='e_death';
  else if(state.intel || hasItem('radio')) id='e_evac';
  else if(state.faction==='army') id='e_army';
  else if(state.faction==='org') id='e_org';
  else id='e_alone';
  state.ending=id;
  renderEnding(scenes[id]);
}

function renderEnding(node){
  Audio.setHeartbeat(false);
  if(node.ending==='长夜') Audio.endingSad(); else Audio.endingHope();
  clearChoices();
  stageEl.textContent=''; stageEl.classList.add('done');
  const ov=document.createElement('div'); ov.className='overlay';
  ov.innerHTML = '<div class="ending-tag">—— '+node.ending+' ——</div>'+
    '<h1 style="font-size:26px;margin-bottom:20px">'+node.ending+'</h1>'+
    '<p class="ending-text">'+node.text.replace(/\n/g,'<br>')+'</p>'+
    '<div style="font-size:13px;color:var(--muted);margin-bottom:18px">你以「'+profile.name+'」的身份，撑过了 '+state.day+' 天</div>'+
    (state.ending && state.ending!=='e_death' ? '<div><button class="btn" onclick="showEpilogue()">看一看日后谈</button></div>' : '')+
    '<div style="margin-top:14px"><button class="btn" onclick="restart()">再玩一次</button>'+
    '<button class="btn" style="margin-left:10px;background:transparent;color:var(--accent);border:1px solid var(--accent)" onclick="backToProf()">换职业重来</button></div>';
  hudEl.parentNode.appendChild(ov);
}

function pickEvent(){
  const pool = RANDOM_EVENTS.filter(e=>{
    if(e.notFaction && state.faction===e.notFaction) return false;
    return !e.faction || e.faction===state.faction;
  });
  return pool[Math.floor(Math.random()*pool.length)];
}
function renderEvent(ev, back){
  const node = { choices: ev.choices.map(c=>{
      const cc=JSON.parse(JSON.stringify(c));
      if(cc.ok && cc.ok.next===undefined) cc.ok.next=back;
      if(cc.no && cc.no.next===undefined) cc.no.next=back;
      return cc;
    }) };
  stageEl.classList.remove('done');
  const text = nightNote + ev.text; nightNote='';
  typeText(text, ()=> buildChoices(node, 'r'));
}
function showEpilogue(){
  const key = (state.ending==='e_evac') ? 'evac' : (state.faction||'alone');
  const text = EPILOGUES[key] || EPILOGUES.alone;
  const ov=document.createElement('div'); ov.className='overlay';
  ov.innerHTML = '<div class="ending-tag">—— 日后谈 ——</div>'+
    '<h1 style="font-size:22px;margin-bottom:20px">战争之后</h1>'+
    '<p class="ending-text">'+text.replace(/\n/g,'<br>')+'</p>'+
    '<div><button class="btn" onclick="this.closest(\'.overlay\').remove()">返回结局</button></div>'+
    '<div style="margin-top:14px"><button class="btn" onclick="restart()">再玩一次</button></div>';
  document.getElementById('app').appendChild(ov);
}

let fullText='', typeDone=null;
function typeText(text, done){
  clearInterval(typeTimer); typing=true;
  fullText=text; typeDone=done;
  stageEl.textContent=''; stageEl.classList.remove('done');
  let i=0;
  typeTimer=setInterval(()=>{ i++; stageEl.textContent=text.slice(0,i);
    if(i%2===0) Audio.tick();
    if(i>=text.length) finishType();
  },20);
}
function finishType(){
  clearInterval(typeTimer);
  if(!typing) return;
  typing=false;
  stageEl.textContent=fullText;
  stageEl.classList.add('done');
  const d=typeDone; typeDone=null;
  if(d) d();
}
stageEl.addEventListener('click', ()=>{ if(typing) finishType(); });

// —— 背景故事 ——
const PROLOGUE = [
  "这座城市，曾经也有过平静的日子。清晨的集市，傍晚的炊烟，孩子在巷子里追逐，电车叮叮当当地驶过街角。",
  "战争是什么时候开始的，你已经记不清了。只记得某个深夜，第一声炮响撕破了天空。从那以后，宁静成了奢侈品。",
  "供水断了，供电停了，货架被搬空，街道上只剩下弹坑和瓦砾。活着的人像老鼠一样躲进地下室，数着炮声，数着日子。",
  "你只是一个普通人。没有军衔，没有使命，没有人在乎你的死活。你能依靠的，只有自己的双手、过去的经验，和一点点不肯认命的固执。",
  "活下去。\n\n—— 这是你现在，唯一要做的事。"
];
let storyIdx=0;
function showStory(){
  hudEl.style.display='none';
  stageEl.textContent=''; clearChoices();
  storyIdx=0;
  playBeat();
  function playBeat(){
    stageEl.classList.remove('done');
    typeText(PROLOGUE[storyIdx], ()=>{
      const btn=document.createElement('button'); btn.className='primary';
      btn.textContent = (storyIdx < PROLOGUE.length-1) ? '继续' : '继续 → 选择你的过去';
      btn.onclick=()=>{ storyIdx++; if(storyIdx<PROLOGUE.length){ clearChoices(); playBeat(); } else { showProfession(); } };
      choicesEl.appendChild(btn);
    });
  }
}

// —— 角色创建 ——
let profile=null, alloc={}, pool=POOL;

function showTitle(){
  hudEl.style.display='none';
  stageEl.textContent=''; clearChoices();
  const ov=document.createElement('div'); ov.className='overlay';
  ov.innerHTML='<h1>炮火之下</h1>'+
    '<p class="sub">战火中的城市。没有英雄，只有想活下去的普通人。<br>选择你的过去，分配你的能力，撑过这十五天。</p>'+
    '<button class="btn" onclick="Audio.unlock();Audio.startAmbient();Audio.title();this.parentNode.remove();showStory()">开始</button>';
  document.getElementById('app').appendChild(ov);
}

function showProfession(){
  clearChoices(); stageEl.textContent='';
  const ov=document.createElement('div'); ov.className='overlay';
  ov.innerHTML='<h2>你曾经是……</h2><p class="sub">你的职业，决定你初始的能力加成。</p><div class="prof-grid" id="pg"></div><button class="btn" id="nextP" disabled>下一步：分配能力</button>';
  document.getElementById('app').appendChild(ov);
  const pg=$('pg');
  PROFESSIONS.forEach(p=>{
    const c=document.createElement('div'); c.className='prof-card';
    const bstr=Object.entries(p.bonus).map(([k,v])=>STATS.find(s=>s.key===k).label+' +'+v).join(' · ');
    c.innerHTML='<div class="n">'+p.name+'</div><div class="b">'+bstr+'</div><div class="d">'+p.desc+'</div>';
    c.onclick=()=>{ profile=p; document.querySelectorAll('.prof-card').forEach(x=>x.classList.remove('sel')); c.classList.add('sel'); $('nextP').disabled=false; };
    pg.appendChild(c);
  });
  $('nextP').onclick=function(){ this.closest('.overlay').remove(); showAlloc(); };
}

function showAlloc(){
  clearChoices(); stageEl.textContent='';
  alloc={}; pool=POOL;
  const ov=document.createElement('div'); ov.className='overlay';
  ov.innerHTML='<h2>分配你的能力</h2><div class="pool">剩余点数：<span id="pool">'+POOL+'</span></div><div id="sr"></div><button class="btn" id="go" style="margin-top:18px">开始求生</button>';
  document.getElementById('app').appendChild(ov);
  const sr=$('sr');
  STATS.forEach(st=>{
    const bonus=profile.bonus[st.key]||0;
    const row=document.createElement('div'); row.className='stat-row';
    row.innerHTML='<div class="info"><div class="name">'+st.label+(bonus?'<small>职业 +'+bonus+'</small>':'')+'</div><div class="desc">'+st.desc+'</div></div>'+
      '<div class="ctrl"><button data-k="'+st.key+'" data-a="-1">−</button><span class="val" id="v-'+st.key+'">'+(BASE+bonus)+'</span><button data-k="'+st.key+'" data-a="1">＋</button></div>';
    sr.appendChild(row);
  });
  function refresh(){
    $('pool').textContent=pool;
    STATS.forEach(st=>{
      const bonus=profile.bonus[st.key]||0, a=alloc[st.key]||0;
      $('v-'+st.key).textContent=BASE+bonus+a;
      row0(st.key,'-1').disabled = (alloc[st.key]||0)<=0;
      row0(st.key,'1').disabled = pool<=0 || (BASE+bonus+(alloc[st.key]||0))>=CAP;
    });
  }
  function row0(k,dir){ return sr.querySelector('button[data-k="'+k+'"][data-a="'+dir+'"]'); }
  sr.addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b) return;
    const k=b.dataset.k, dir=+b.dataset.a, bonus=profile.bonus[k]||0;
    alloc[k]=alloc[k]||0;
    if(dir>0 && pool>0 && BASE+bonus+alloc[k]<CAP){ alloc[k]++; pool--; }
    if(dir<0 && alloc[k]>0){ alloc[k]--; pool++; }
    refresh();
  });
  refresh();
  $('go').onclick=function(){
    // 应用属性
    state.hp=100; state.food=3; state.materials=1; state.day=1; state.helped=0; state.hardened=0; state.intel=false; state.faction=null; state.ending=null; state.items=[];
    state.stats={};
    STATS.forEach(st=>{ state.stats[st.key]=BASE+(profile.bonus[st.key]||0)+(alloc[st.key]||0); });
    this.closest('.overlay').remove();
    hudEl.style.display='block';
    nightNote='';
    renderScene('d1');
  };
}

function restart(){ document.querySelectorAll('.overlay').forEach(o=>o.remove()); state.hp=100;state.food=3;state.materials=1;state.day=1;state.helped=0;state.hardened=0;state.intel=false;state.faction=null;state.ending=null; state.items=[]; nightNote=''; renderScene('d1'); }
function backToProf(){ document.querySelectorAll('.overlay').forEach(o=>o.remove()); state.faction=null; state.ending=null; showProfession(); }

showTitle();
</script>
</body>
